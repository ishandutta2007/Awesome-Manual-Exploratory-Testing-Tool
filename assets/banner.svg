<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Vibrant primary glow gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Badge/Pill gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseCircle {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.18); opacity: 0.45; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -80; }
    }
    @keyframes pulseBadge {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6)); }
    }

    .bg-grid { opacity: 0.9; }
    .floating-pill-1 { animation: floatPill 6s ease-in-out infinite; }
    .floating-pill-2 { animation: floatPill 5s ease-in-out infinite 1.5s; }
    .floating-pill-3 { animation: floatPill 7s ease-in-out infinite 0.7s; }
    .pulsing-glow { transform-origin: 600px 180px; animation: pulseCircle 8s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 6; animation: dashFlow 20s linear infinite; }
    .banner-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .banner-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .banner-badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#techGrid)" class="bg-grid" />

  <!-- Dynamic / Animated Background Layer -->
  <g class="pulsing-glow">
    <circle cx="600" cy="180" r="260" fill="url(#pulseGlow)" filter="url(#glowEffect)" />
    <circle cx="200" cy="80" r="140" fill="url(#pulseGlow)" filter="url(#glowEffect)" />
    <circle cx="1020" cy="270" r="160" fill="url(#pulseGlow)" filter="url(#glowEffect)" />
  </g>

  <!-- Dynamic Connecting Flow Lines (Behind Content) -->
  <g class="flow-line" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" fill="none">
    <path d="M 60 90 Q 240 40 450 90 T 800 60 T 1140 100" />
    <path d="M 60 270 Q 300 320 620 270 T 960 300 T 1140 250" />
  </g>

  <!-- Interactive / Dynamic Floating Feature Pills (Lower Z-Index, flanking edges) -->
  <g class="floating-pill-1" transform="translate(70, 48)">
    <rect width="170" height="34" rx="17" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" fill="#bae6fd" class="banner-badge">⏱️ SBTM Timeboxing</text>
  </g>

  <g class="floating-pill-2" transform="translate(950, 52)">
    <rect width="180" height="34" rx="17" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="5" fill="#818cf8" />
    <text x="32" y="22" fill="#c7d2fe" class="banner-badge">📸 Evidence Capture</text>
  </g>

  <g class="floating-pill-3" transform="translate(90, 280)">
    <rect width="185" height="34" rx="17" fill="url(#pillGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="5" fill="#a855f7" />
    <text x="32" y="22" fill="#e9d5ff" class="banner-badge">🎯 Heuristic Charters</text>
  </g>

  <g class="floating-pill-2" transform="translate(940, 275)">
    <rect width="185" height="34" rx="17" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" fill="#bae6fd" class="banner-badge">🐛 Boundary Injections</text>
  </g>

  <!-- FOREGROUND LAYER: Main Branding & Typography (Guaranteed Unobscured) -->
  <g transform="translate(600, 100)" text-anchor="middle">
    <!-- Super-Badge -->
    <rect x="-140" y="-32" width="280" height="28" rx="14" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="-14" fill="#7dd3fc" class="banner-badge" text-anchor="middle">⚡ CURATED QA &amp; TEST ENGINEERING</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="url(#primaryGrad)" class="banner-title" font-size="44" letter-spacing="-1">
      Awesome Manual &amp; Exploratory Testing
    </text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="98" fill="#e2e8f0" class="banner-sub" font-size="19" letter-spacing="-0.2">
      Session-Based Test Management • Exploratory Assistants • Bug Capture • Edge-Case Tools
    </text>

    <!-- Subtitle Line 2 / Meta details -->
    <text x="0" y="132" fill="#94a3b8" class="banner-sub" font-size="14.5">
      The definitive index of SaaS platforms &amp; open-source toolkits for high-velocity software quality
    </text>

    <!-- Subtle Tech Badges Under Title -->
    <g transform="translate(0, 162)">
      <rect x="-240" y="0" width="95" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="-192" y="16" fill="#cbd5e1" class="banner-badge" font-size="11">🚀 SaaS QA</text>

      <rect x="-135" y="0" width="125" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="-72" y="16" fill="#cbd5e1" class="banner-badge" font-size="11">💻 Open Source</text>

      <rect x="0" y="0" width="115" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="58" y="16" fill="#cbd5e1" class="banner-badge" font-size="11">⏱️ SBTM Tools</text>

      <rect x="125" y="0" width="120" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="185" y="16" fill="#cbd5e1" class="banner-badge" font-size="11">🧩 Extensions</text>
    </g>
  </g>
</svg>
